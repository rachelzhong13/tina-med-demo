    server {
        listen 443 ssl;
        server_name ioaforthings.iotns.org.cn;

        ssl_certificate cert/tina_ioaforthings.crt;
        ssl_certificate_key cert/tina_ioaforthings.key;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location = / {
            return 302 /TINAapimed/;
        }

        location = /TINAapimed {
            return 301 /TINAapimed/;
        }

        location /TINAapimed/ {
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            client_body_buffer_size 16m;
            client_max_body_size 20m;
            proxy_pass http://tina-med-demo-frontend-1/TINAapimed/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
