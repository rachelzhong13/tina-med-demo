services:
  - type: web
    name: tina-med-demo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: data/tina_med.db
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT
        value: 60
      - key: PUBLIC_BASE_URL
        value: https://rachelzhong13.github.io/tina-med-demo
      - key: PUBLIC_ROUTER_MODE
        value: hash
      - key: CORS_ORIGINS
        value: https://rachelzhong13.github.io
